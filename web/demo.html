<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night's Watch</title>
<meta name="description" content="Know the moment a vendor's change breaks your privacy policy.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0b0c'/%3E%3Cpath d='M10 26V12h2V9h2v3h4V9h2v3h2v14z' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif&display=swap">
<style>
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f7f7f5; --wash:#fafaf8;
  --ink:#0b0b0c; --ink-2:#52525b; --ink-3:#8b8b93;
  --line:#ededeb; --line-2:#e0e0dc;
  --ice:#0b0b0c;
  --green:#16803c; --green-bg:#f3fbf5; --green-line:#cdebd6;
  --red:#c0271a; --red-bg:#fff5f3; --red-line:#f7d0ca;
  --amber:#b45309; --amber-bg:#fffaf0; --amber-line:#f5e1b8;
  --sans:Geist,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --serif:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:16px;
  --shadow:0 1px 2px rgba(15,15,20,.04),0 10px 30px -14px rgba(15,15,20,.12);
  --shadow-lg:0 1px 2px rgba(15,15,20,.05),0 24px 48px -20px rgba(15,15,20,.18);
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
a:hover{text-decoration-color:currentColor}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}
button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 24px}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.mono{font-family:var(--mono)}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;height:80px}
.brand{display:inline-flex;align-items:center;gap:10px;font:400 25px/1 var(--serif);letter-spacing:-.005em;color:var(--ink);text-decoration:none;border-radius:6px}
.brand:hover{opacity:.75}
.brand:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.about{color:var(--ink-2);font-size:14px;text-decoration:none}.about:hover{color:var(--ink)}
.brand svg{width:19px;height:19px;color:var(--ink)}
.top-r{display:flex;align-items:center;gap:16px;font-size:13.5px;color:var(--ink-2);min-width:0}
.top-r .host{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px;color:var(--ink)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none;box-shadow:0 0 0 4px var(--green-bg);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(22,128,60,.06)}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:#fff;font:500 15px/1 var(--sans);letter-spacing:-.005em;padding:16px 26px;border-radius:12px;border:0;cursor:pointer;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.1),0 10px 24px -10px rgba(0,0,0,.45);transition:background .15s,opacity .15s,transform .15s,box-shadow .15s}
.btn:hover{background:#27272a;transform:translateY(-1px);box-shadow:0 1px 2px rgba(0,0,0,.1),0 14px 28px -12px rgba(0,0,0,.5)}
.btn:active{transform:none}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.link-btn{background:none;border:0;padding:4px 2px;color:var(--ink-2);cursor:pointer;font-size:14px;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:4px}
.link-btn:hover{color:var(--ink);text-decoration-color:currentColor}
.link-btn:disabled{opacity:.4;cursor:default}

/* connect */
.hero{padding:12vh 0 80px}
.nhero{text-align:center;padding:9vh 0 90px;position:relative}
.nhero::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse 70% 45% at 50% 100%,rgba(120,170,220,.35),transparent 70%),radial-gradient(ellipse 60% 40% at 15% 10%,rgba(255,255,255,.9),transparent 70%),linear-gradient(180deg,#dcebf8 0%,#eef4fa 45%,#f7f5ef 100%)}
.n-pill{display:inline-flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:12px;background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.9);box-shadow:0 4px 16px -6px rgba(30,50,80,.25);font-size:14px;margin-bottom:5vh}
.n-pill b{background:#16161a;color:#fff;font-weight:500;font-size:12.5px;padding:4px 9px;border-radius:7px}
.n-h1{font:400 clamp(52px,9vw,104px)/.98 var(--serif);letter-spacing:-.02em;margin:0 0 22px;color:#2b2a24}
.n-h1 em{font-style:italic}
.n-word{color:#2f6fae;display:inline-block;transition:opacity .35s,filter .35s}
.n-word.out{opacity:0;filter:blur(6px)}
.n-caret{display:inline-block;width:3px;height:.8em;margin-left:4px;background:#2f6fae;vertical-align:-.05em;animation:ncaret 1s steps(1) infinite}
@keyframes ncaret{50%{opacity:0}}
.n-sub{font:italic 400 22px/1.4 var(--serif);color:#4a4940;margin:0 0 38px}
.n-form{display:flex;align-items:center;gap:8px;max-width:620px;margin:0 auto;padding:8px 8px 8px 24px;border-radius:20px;background:linear-gradient(100deg,rgba(255,255,255,.85),rgba(206,230,252,.85) 60%,rgba(255,255,255,.85));border:1px solid rgba(255,255,255,.95);box-shadow:0 20px 50px -20px rgba(30,60,100,.45)}
.n-form input{flex:1;min-width:0;background:none;border:0;font:18px var(--sans);color:var(--ink);padding:12px 0}
.n-form input:focus{outline:none}
.n-form:focus-within{box-shadow:0 0 0 3px rgba(120,170,220,.35),0 20px 50px -20px rgba(30,60,100,.45)}
.n-form .btn{padding:16px 24px;border-radius:14px}
.nhero .err{text-align:center;margin:12px 0 0}
.n-cap{font:italic 400 19px/1.4 var(--serif);color:#3c3b34;margin:22px 0 0}
@media (max-width:560px){.n-form{padding-left:16px}.n-form .btn{padding:14px 16px}.n-sub{font-size:19px}}
h1{font:400 56px/1.04 var(--serif);letter-spacing:-.015em;margin:0 0 20px}
.lede{font-size:18px;line-height:1.6;color:var(--ink-2);margin:0 0 44px;max-width:540px}
form#connect{max-width:520px}
label.field{display:block;font-size:13px;font-weight:500;color:var(--ink);margin-bottom:10px}
.input{width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;color:var(--ink);font:15px/1.3 var(--sans);padding:15px 16px;box-shadow:0 1px 2px rgba(15,15,20,.04);transition:border-color .15s,box-shadow .15s}
.input::placeholder{color:#a8a8af}
.input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 4px rgba(11,11,12,.06)}
.hint{font-size:13.5px;color:var(--ink-3);margin:10px 0 28px}
.err{color:var(--red);font-size:14px;margin:16px 0 0}

/* setup */
.page{padding:48px 0 80px}
.url-line{font:13px/1.4 var(--sans);color:var(--ink-3);margin:0 0 14px;word-break:break-all}
h2{font:400 36px/1.1 var(--serif);letter-spacing:-.01em;margin:0 0 10px}
h3{font:600 17px/1.35 var(--sans);letter-spacing:-.01em;margin:0}

/* progress list */
.steps{list-style:none;margin:28px 0 0;padding:6px 22px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.steps:empty{display:none}
.steps li{display:grid;grid-template-columns:22px 1fr;gap:14px;padding:13px 0;align-items:start}
.steps li + li{border-top:1px solid var(--line)}
.steps .ic{width:22px;height:22px;display:grid;place-items:center;margin-top:1px;border-radius:50%}
.steps .ic svg{width:13px;height:13px}
.steps .t{font-size:15px}
.steps .d{font-size:13.5px;color:var(--ink-3);margin-top:2px;word-break:break-word}
.steps li.done .ic{color:#fff;background:var(--ink)}
.steps li.active .t{color:var(--ink);font-weight:500}
.steps li.done .t{color:var(--ink-2)}
.steps li.failed .ic{color:#fff;background:var(--red)}
.steps li.failed .t{color:var(--red)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--ink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fail-box{margin-top:18px;padding:16px 18px;border:1px solid var(--red-line);background:var(--red-bg);border-radius:14px;font-size:14px}
.fail-box p{margin:0 0 12px;color:var(--ink)}

/* status card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px 28px;box-shadow:var(--shadow)}
.status{display:flex;gap:18px;align-items:flex-start}
.status .mark{width:10px;height:10px;border-radius:50%;margin-top:14px;flex:none}
.status h2{font-size:30px;margin:0 0 6px}
.status p{margin:0;font-size:14px;color:var(--ink-2)}
.tone-green{border-color:var(--green-line);background:linear-gradient(180deg,var(--green-bg),#fff 85%)}
.tone-green .mark{background:var(--green);box-shadow:0 0 0 5px rgba(22,128,60,.1)}
.tone-red{border-color:var(--red-line);background:linear-gradient(180deg,var(--red-bg),#fff 85%)}
.tone-red .mark{background:var(--red);box-shadow:0 0 0 5px rgba(192,39,26,.1)}
.tone-amber{border-color:var(--amber-line);background:linear-gradient(180deg,var(--amber-bg),#fff 85%)}
.tone-amber .mark{background:var(--amber);box-shadow:0 0 0 5px rgba(180,83,9,.1)}

section.block{margin-top:48px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-h h3{font:600 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.sec-h span{font-size:13px;color:var(--ink-3)}

/* vendor list */
.vendors{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.vrow + .vrow{border-top:1px solid var(--line)}
.vbtn{width:100%;display:grid;grid-template-columns:1fr auto auto 16px;gap:16px;align-items:center;background:none;border:0;padding:18px 22px;cursor:pointer;text-align:left;transition:background .12s}
.vbtn:hover{background:var(--wash)}
.vbtn:focus-visible{outline-offset:-2px;border-radius:0}
.vname{font-weight:500;font-size:15.5px;letter-spacing:-.005em}
.vcount{font-size:13.5px;color:var(--ink-3);white-space:nowrap}
.chev{width:16px;height:16px;color:var(--ink-3);transition:transform .18s}
.vbtn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:4px 10px;border-radius:999px;white-space:nowrap;border:1px solid}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.compliant{color:var(--green);border-color:var(--green-line);background:var(--green-bg)}
.pill.not_compliant{color:var(--red);border-color:var(--red-line);background:var(--red-bg)}
.pill.exposed{color:var(--amber);border-color:var(--amber-line);background:var(--amber-bg)}
.pill.review{color:var(--amber);border-color:var(--amber-line);background:var(--amber-bg)}
.pill.unknown{color:var(--ink-3);border-color:var(--line-2);background:transparent}
.cols.solo{grid-template-columns:minmax(0,1fr)}
.sp .rv{color:var(--amber);font-size:12.5px;margin-left:8px}
.chain-note{font-size:14px;color:var(--ink-2);margin:0}
.sim-vendor{margin-bottom:4px;font-family:var(--sans)}
.sim-tag{display:inline-block;font:500 11.5px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--amber);border:1px solid var(--amber-line);background:var(--amber-bg);padding:4px 8px;border-radius:6px;margin-bottom:8px}
.vpanel{padding:4px 22px 22px;background:var(--wash);border-top:1px solid var(--line)}
.vpanel[hidden]{display:none}
.vpanel h4{font:600 11.5px/1 var(--sans);color:var(--ink-3);margin:18px 0 8px;letter-spacing:.08em;text-transform:uppercase}
.sp{list-style:none;margin:0;padding:0}
.sp li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 0;font-size:14px;border-top:1px solid var(--line)}
.sp li:first-child{border-top:0}
.sp .c{color:var(--ink-3)}
.tag{font-size:12px;color:var(--ink);background:#fff;border:1px solid var(--line-2);border-radius:999px;padding:2px 9px}
.issue{border:1px solid var(--red-line);border-left:3px solid var(--red);background:#fff;border-radius:10px;padding:10px 14px;margin:6px 0 12px}
.issue.amber{border-color:var(--amber-line);border-left-color:var(--amber)}
.issue .it{font-size:14px;font-weight:500}
.issue .id{font-size:13.5px;color:var(--ink-2);margin:2px 0 4px}
.issue a,.policy-link{font-size:13.5px}

/* simulate */
.sim-intro{margin:0 0 18px;color:var(--ink-2);font-size:14.5px}
.seg{display:inline-flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;max-width:100%}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{padding:13px 16px 13px 42px;border-radius:12px;font-size:14.5px;color:var(--ink-2);cursor:pointer;border:1px solid var(--line-2);background:var(--surface);position:relative;transition:border-color .15s,box-shadow .15s,color .15s}
.seg label:before{content:"";box-sizing:border-box;position:absolute;left:16px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;border:1.5px solid var(--line-2);background:#fff;transition:border .15s}
.seg label:hover{border-color:#c9c9c4;color:var(--ink)}
.seg input:checked + label{color:var(--ink);border-color:var(--ink);box-shadow:0 0 0 3px rgba(11,11,12,.05)}
.seg input:checked + label:before{border:4.5px solid var(--ink)}
.seg input:focus-visible + label{outline:2px solid var(--ink);outline-offset:2px}
.seg input:disabled + label{cursor:default;opacity:.55}
.custom{max-width:520px;margin:0 0 20px}.custom .input{margin-bottom:14px}.custom em{font-style:normal;color:var(--ink-3);font-weight:400}
.wrap:has(.cols){max-width:1240px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:40px;align-items:start}
.cols>section[aria-labelledby="sim-h"]{position:sticky;top:20px}
.cols .seg{display:flex;flex-direction:column;width:100%}
@media (max-width:960px){.cols{grid-template-columns:minmax(0,1fr);gap:0}.cols>section[aria-labelledby="sim-h"]{position:static}}
.report{margin-top:26px;overflow-x:auto}
.report table{width:100%;border-collapse:collapse;font-size:14px}
.report th{text-align:left;font-weight:500;color:var(--ink-3);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line-2)}
.report td{padding:10px;border-bottom:1px solid var(--line-2);vertical-align:top;color:var(--ink-2)}
.report td:first-child{color:var(--ink)}
.rp-b{display:inline-block;white-space:nowrap;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-3)}
.rp-ok{color:var(--green);border-color:currentColor}
.rp-bad{color:var(--amber);border-color:currentColor;white-space:normal}
.rp-w{font-size:11px;color:var(--ice);margin-left:6px}
.sim-actions{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.sim-run{margin-top:8px}

/* result */
.result{margin-top:24px}
.result h3{font:400 24px/1.2 var(--serif);letter-spacing:-.005em;margin-bottom:8px}
.result .why{margin:0 0 12px;color:var(--ink-2);font-size:14.5px}
.result .mark{width:10px;height:10px;border-radius:50%;margin-top:10px;flex:none}
.result .head{display:flex;gap:14px}
.result .body{min-width:0;flex:1}

/* disclosures */
details.disc{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
details.disc summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);padding:2px 0}
details.disc summary::-webkit-details-marker{display:none}
details.disc summary:before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-right:2px}
details.disc[open] summary:before{transform:rotate(45deg)}
details.disc summary:hover{color:var(--ink)}
.disc-body{padding:10px 0 4px 16px;font-size:14px}
.disc-body ol,.disc-body ul{margin:0;padding-left:18px}
.disc-body li{margin:5px 0}
.disc-body .d{color:var(--ink-3);font-size:13px;word-break:break-word}
.meta{font-size:13px;color:var(--ink-3);margin-top:10px}

.footer{margin:72px 0 60px}
.footer details.disc{border-top:1px solid var(--line)}
.rows{margin:6px 0 0;padding:0;list-style:none}
.rows li{display:flex;justify-content:space-between;gap:20px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.rows li:first-child{border-top:0}
.rows li span:first-child{color:var(--ink-2)}
.rows li span:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.rows-h{font:600 11.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:22px 0 6px}
.mock-note{position:fixed;right:12px;bottom:12px;font:12px/1 var(--mono);color:var(--ink-3);border:1px solid var(--line);padding:6px 8px;border-radius:8px;background:var(--bg)}

@media (max-width:560px){
  .wrap{padding:0 16px}
  h1{font-size:40px}
  h2{font-size:30px}
  .status h2{font-size:25px}
  .hero{padding-top:8vh}
  .vbtn{grid-template-columns:1fr auto 16px;padding:14px 16px;gap:10px}
  .vcount{grid-column:1;grid-row:2;margin-top:-10px}
  .vbtn .pill{grid-column:2;grid-row:1}
  .vbtn .chev{grid-column:3;grid-row:1}
  .vpanel{padding:4px 16px 16px}
  .top-r .host{max-width:130px}
  .card{padding:20px}
  .steps{padding:4px 16px}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
  .spin{border-color:var(--ink);opacity:.7}
}
</style>
</head>
<body>
<div id="app" class="wrap"></div>

<script>
(() => {
"use strict";

// ---------- helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => { const s = String(u || ""); return /^(https?:\/\/|\/)/i.test(s) ? s : ""; };
const fmt = n => (n == null || n === "" || isNaN(Number(n))) ? "—" : Number(n).toLocaleString("en-US");
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + "s")}`;
const cleanName = s => String(s || "").replace(/\s*\(demo mirror\)\s*/i, "").trim();
const hhmm = d => d ? d.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}) : "";
const reduced = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const hostOf = u => { try { return new URL(u).host; } catch { return u || ""; } };

const ICON = {
  brand: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 4h3v3h2V4h4v3h2V4h3v6H5zM7 11h10v11H7z"/></svg>',
  check: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  x: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7m0-7l-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};
const STATUS_LABEL = {compliant: "Compliant", not_compliant: "Not compliant", exposed: "Exposed", review: "Needs review", unknown: "No location"};
const SCENARIOS = [
  {id: "new_subprocessor", label: "Adds a new sub-processor (DataHarvest Ltd)"},
  {id: "training_clause", label: "Changes its AI-training clause"},
];

// ---------- mock API (?mock=1) ----------
const params = new URLSearchParams(location.search);
const MOCK = true;  // public demo: always the recording

function makeMock() {
  // GENERATED by web/build_app_demo.py: replays one real run (demo.json) instead of lane B's invented mock data.
  const SITE = "https://trust.nightswatch-inc.example";
  const rec = fetch("demo.json").then(r => { if (!r.ok) throw new Error("recording " + r.status); return r.json(); }).then(d => d.app);
  const m = {stage: null, jobs: {}, current: null, nextId: 1};
  const overview = A => m.stage ? Object.assign({}, m.stage === "base" ? A.base : A.stages[m.stage], {site_url: SITE})
                                : Object.assign({}, A.base, {site_url: SITE, watching: false, vendors: [], latest_event: null});
  const same = [["Applying the change to Tinybird's demo mirror", "Same as what Night's Watch already has"],
                ["Read Tinybird's pages via Nimble", ""], ["Result: nothing changed that affects your policies", ""]];
  function next(A, kind, sc) {
    const at = m.stage, clean = at === "base" || at === "undo";
    if (kind === "onboard") return {to: "base", plan: A.onboard};
    if (sc === "new_subprocessor" && clean) return {to: sc, plan: A.sims[sc]};
    if (sc === "training_clause" && at === "new_subprocessor") return {to: sc, plan: A.sims[sc]};
    if (sc === "undo" && !clean) return {to: "undo", plan: A.sims.undo};
    if (sc === "training_clause" && clean)
      return {error: "In this recorded run the AI-training clause changed after the new sub-processor. Run \"Tinybird adds a sub-processor\" first."};
    return {to: at, plan: same};
  }
  function startJob(A, kind, sc) {
    if (m.current && m.jobs[m.current].status === "running") return {status: 409, data: {error: "busy"}};
    const n = next(A, kind, sc);
    if (n.error) return {status: 400, data: {error: n.error}};
    const id = "rec" + m.nextId++;
    m.jobs[id] = {id, kind, t0: Date.now(), plan: n.plan, to: n.to, status: "running"};
    m.current = id;
    return {status: 200, data: {job: id}};
  }
  function jobView(id) {
    const j = m.jobs[id]; if (!j) return {status: 404, data: {error: "not found"}};
    const n = Math.floor((Date.now() - j.t0) / (reduced() ? 1 : 850));
    const steps = j.plan.slice(0, n + 1).map(([text, detail], i) => ({text, state: i < n ? "done" : "active", detail: i < n ? detail : ""}));
    if (n >= j.plan.length && j.status === "running") { j.status = "done"; m.stage = j.to; }
    return {status: 200, data: {id, kind: j.kind, status: j.status, steps, error: null}};
  }
  return async (method, path, body) => {
    const A = await rec;
    await new Promise(r => setTimeout(r, 80));
    if (path === "/api/overview") return {status: 200, data: overview(A)};
    if (path === "/api/onboard") return startJob(A, "onboard");
    if (path === "/api/simulate") return startJob(A, "simulate", body.scenario);
    const jm = path.match(/^\/api\/job\/(.+)$/); if (jm) return jobView(decodeURIComponent(jm[1]));
    return {status: 404, data: {error: "not found"}};
  };
}
const mockApi = MOCK ? makeMock() : null;

async function api(method, path, body) {
  if (mockApi) return mockApi(method, path, body);
  const opt = {method, headers: {}};
  if (body !== undefined) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  let data = null; try { data = await r.json(); } catch { data = null; }
  return {status: r.status, data: data || {}};
}

// ---------- rendering pieces ----------
function topBar(right) {
  return `<header class="top"><a class="brand" href="/" id="home" aria-label="Night's Watch home">${ICON.brand}Night's Watch</a><div class="top-r">${right || ""}<a class="about" href="./" target="_blank" rel="noopener">About</a></div></header>`;
}

function renderStepsInto(ol, steps) {
  // Incremental update so aria-live only announces what changed.
  steps = steps || [];
  for (let i = 0; i < steps.length; i++) {
    const s = steps[i]; const state = ["done","active","failed"].includes(s.state) ? s.state : "active";
    let li = ol.children[i];
    const sig = state + "|" + s.text + "|" + (s.detail || "");
    if (li && li.dataset.sig === sig) continue;
    if (!li) { li = document.createElement("li"); ol.appendChild(li); }
    li.dataset.sig = sig; li.className = state;
    const ic = state === "done" ? ICON.check : state === "failed" ? ICON.x : '<span class="spin" aria-hidden="true"></span>';
    const sr = state === "done" ? "Done: " : state === "failed" ? "Failed: " : "In progress: ";
    li.innerHTML = `<span class="ic">${ic}</span><div><div class="t"><span class="sr-only">${sr}</span>${esc(s.text)}</div>${s.detail ? `<div class="d">${esc(s.detail)}</div>` : ""}</div>`;
  }
  while (ol.children.length > steps.length) ol.lastElementChild.remove();
}

function keepOpen(root, fn) {
  const open = new Set([...root.querySelectorAll("details[data-k][open]")].map(d => d.dataset.k));
  const f = document.activeElement && root.contains(document.activeElement) ? document.activeElement.dataset.f : null;
  fn();
  root.querySelectorAll("details[data-k]").forEach(d => { if (open.has(d.dataset.k)) d.open = true; });
  if (f) { const el = root.querySelector(`[data-f="${CSS.escape(f)}"]`); if (el) el.focus({preventScroll: true}); }
}

function policyLink(p) {
  if (!p) return "";
  const label = `${esc(p.doc || "Privacy Policy")} · ${esc(p.section || "")}`;
  const u = safeUrl(p.url);
  return u ? `<a class="policy-link" href="${esc(u)}" target="_blank" rel="noopener">${label}</a>` : `<span class="policy-link muted">${label}</span>`;
}

// ---------- screen 2: setting up ----------
function showSetup(url) {
  stopPoll();
  S.screen = "setup";
  app.innerHTML = `
    ${topBar("")}
    <main class="page">
      <p class="url-line">${esc(url)}</p>

      <div class="fail-box" id="fail" hidden><p id="fail-msg"></p><button class="btn" type="button" id="retry">Try again</button> <button class="link-btn" type="button" id="change" style="margin-left:14px">Use a different URL</button></div>
    </main>`;
  $("#retry").addEventListener("click", () => startOnboard(url));
  $("#change").addEventListener("click", () => { S.url = url; showConnect(); });
}

async function startOnboard(url) {
  S.url = url;
  showSetup(url);
  const ol = $("#steps");
  renderStepsInto(ol, [{text: "Connecting to Night's Watch", state: "active", detail: ""}]);
  let r;
  for (let tries = 0; ; tries++) {  // one job at a time: wait for the running check instead of failing
    try { r = await api("POST", "/api/onboard", {url}); }
    catch { return setupFailed("Can't reach the Night's Watch service. Check that it's running."); }
    if (r.status !== 409 || tries >= 40 || S.screen !== "setup") break;
    renderStepsInto(ol, [{text: "Waiting for the current check to finish", state: "active", detail: ""}]);
    await new Promise(res => setTimeout(res, 3000));
  }
  if (r.status === 409) return setupFailed("Night's Watch is finishing another check. Try again in a moment.");
  if (r.status >= 400 || !r.data.job) return setupFailed(r.data.error || `The request failed (${r.status}).`);
  renderStepsInto(ol, []);
  pollJob(r.data.job, job => {
    if (S.screen !== "setup") return;
    renderStepsInto($("#steps"), job.steps);
  }, async job => {
    if (job.status === "failed") return setupFailed(job.error || "A step failed.");
    S.lastChecked = new Date();
    await refreshOverview();
    showWatching();
  });
}

function setupFailed(msg) {
  if (S.screen !== "setup") return;
  const ol = $("#steps");
  if (!ol.querySelector("li.failed")) {
    const act = ol.querySelector("li.active");
    if (act) { act.className = "failed"; act.querySelector(".ic").innerHTML = ICON.x; act.dataset.sig = ""; const sr = act.querySelector(".sr-only"); if (sr) sr.textContent = "Failed: "; }
  }
  $("#setup-h").textContent = "Setup stopped";
  $("#setup-sub").textContent = "Nothing was saved from this attempt.";
  $("#fail-msg").textContent = msg;
  $("#fail").hidden = false;
  $("#retry").focus();
}

// ---------- job polling ----------
function pollJob(id, onUpdate, onEnd) {
  clearTimeout(S.jobTimer);
  S.job = id;
  const tick = async () => {
    let r;
    try { r = await api("GET", "/api/job/" + encodeURIComponent(id)); }
    catch { S.jobTimer = setTimeout(tick, 1200); return; }
    if (S.job !== id) return;
    if (r.status >= 400) { S.job = null; onEnd({status: "failed", error: r.data.error || `Lost track of the job (${r.status}).`, steps: []}); return; }
    const job = r.data;
    onUpdate(job);
    if (job.status === "running") { S.jobTimer = setTimeout(tick, 600); return; }
    S.job = null;
    onEnd(job);
  };
  tick();
}

// ---------- overview ----------
async function refreshOverview() {
  const r = await api("GET", "/api/overview");
  if (r.status >= 400) throw new Error(r.data.error || "overview " + r.status);
  const key = JSON.stringify(r.data);
  const changed = key !== S.ovKey;
  S.ov = r.data; S.ovKey = key;
  return changed;
}

function startPoll() {
  stopPoll();
  const loop = async () => {
    if (S.screen !== "watching") return;
    if (!S.job) {
      try { if (await refreshOverview()) renderWatchingParts(); } catch { /* keep last view */ }
    }
    S.pollTimer = setTimeout(loop, 3000);
  };
  S.pollTimer = setTimeout(loop, 3000);
}
function stopPoll() { clearTimeout(S.pollTimer); S.pollTimer = null; }

function renderWatchingParts() {
  if (S.screen !== "watching" || !S.ov) return;
  renderStatus(); renderVendors(); renderResult(); renderFast(); setTitle();
  if (location.hash !== "#watching") history.replaceState({screen: "watching"}, "", "#watching");
}

function renderStatus() {
  const vs = S.ov.vendors || [];
  if (S.ov.real) {
    const red = vs.filter(v => v.status === "not_compliant").length;
    const n = vs.filter(v => v.status === "review" || v.status === "exposed").length;
    const title = red ? `${plural(red, "vendor")} no longer ${red === 1 ? "complies" : "comply"} with your Privacy Policy`
      : n ? `${n} of ${plural(vs.length, "sub-processor")} ${n === 1 ? "needs" : "need"} review` : `All ${plural(vs.length, "sub-processor")} are in approved countries`;
    const src = safeUrl(S.ov.source_page);
    const bits = red && n ? [`${n} more ${n === 1 ? "needs" : "need"} review`] : [];
    bits.push(src ? `Read from <a href="${esc(src)}" target="_blank" rel="noopener">${esc(src.replace(/^https?:\/\/(www\.)?/, ""))}</a> via Nimble` : "Read via Nimble");
    const lc = S.ov.checked_at ? new Date(S.ov.checked_at) : null;
    if (lc && !isNaN(lc)) bits.push(`last checked ${hhmm(lc)}`);
    const html = `<div class="card status tone-${red ? "red" : n ? "amber" : "green"}"><span class="mark" aria-hidden="true"></span><div><h2>${esc(title)}</h2><p>${bits.join(" · ")}</p></div></div>`;
    const el = $("#status");
    if (el.dataset.sig !== html) { el.innerHTML = html; el.dataset.sig = html; }
    $("#vend-sub").textContent = vs.length ? "Select one to read its own sub-processors" : "";
    return;
  }
  const red = vs.filter(v => v.status === "not_compliant");
  const amber = vs.filter(v => v.status === "exposed");
  let tone = "green", title;
  if (red.length) {
    tone = "red";
    title = `${plural(red.length, "vendor")} no longer ${red.length === 1 ? "complies" : "comply"} with your Privacy Policy`;
  } else if (amber.length) {
    tone = "amber";
    title = `${plural(amber.length, "vendor")} ${amber.length === 1 ? "relies" : "rely"} on a vendor that doesn't comply`;
  } else {
    title = vs.length === 1 ? "Your vendor complies with your Privacy Policy" : `All ${vs.length} vendors comply with your Privacy Policy`;
  }
  const bits = [];
  if (red.length) bits.push(red.map(v => esc(cleanName(v.name))).join(", "));
  if (red.length && amber.length) bits.push(`${plural(amber.length, "vendor")} exposed through ${red.length === 1 ? "it" : "them"}`);
  const checks = S.ov.stats && S.ov.stats.checks;
  if (checks != null) bits.push(`${plural(Number(checks), "check")} run`);
  const lc = S.ov.checked_at ? new Date(S.ov.checked_at) : S.lastChecked;
  if (lc && !isNaN(lc)) bits.push(`last checked ${hhmm(lc)}`);
  const html = `<div class="card status tone-${tone}"><span class="mark" aria-hidden="true"></span><div><h2>${esc(title)}</h2><p>${bits.join(" · ")}</p></div></div>`;
  const el = $("#status");
  if (el.dataset.sig !== html) { el.innerHTML = html; el.dataset.sig = html; }
  $("#vend-sub").textContent = vs.length ? "Select a vendor to see its sub-processors" : "";
}

function renderVendors() {
  const root = $("#vendors"); if (!root) return;
  const vs = S.ov.vendors || [];
  keepOpen(root, () => {
    root.innerHTML = vs.length ? vs.map(v => {
      const open = S.expanded.has(v.slug);
      const st = STATUS_LABEL[v.status] ? v.status : "compliant";
      const n = v.subprocessor_count != null ? v.subprocessor_count : (v.subprocessors || []).length;
      const count = S.ov.real ? esc(v.location || "location not listed") + (v.subprocessor_count != null ? ` · ${plural(Number(n), "sub-processor")}` : "")
                              : plural(Number(n) || 0, "sub-processor");
      const pid = "vp-" + esc(v.slug);
      return `<div class="vrow">
        <button class="vbtn" type="button" data-slug="${esc(v.slug)}" data-f="v-${esc(v.slug)}" aria-expanded="${open}" aria-controls="${pid}">
          <span class="vname">${esc(cleanName(v.name))}</span>
          <span class="vcount">${count}</span>
          <span class="pill ${st}">${STATUS_LABEL[st]}</span>
          ${ICON.chev}
        </button>
        <div class="vpanel" id="${pid}" ${open ? "" : "hidden"}>${open ? vendorPanel(v) : ""}</div>
      </div>`;
    }).join("") : `<div class="vpanel muted" style="padding:18px 20px">No vendors yet.</div>`;
  });
  // an open panel whose chain hasn't been read yet (e.g. after a restart) asks for it once
  if (S.ov.real) for (const v of vs) {
    const k = (S.ov.site_url || "") + "|" + v.slug;
    if (S.expanded.has(v.slug) && v.chain === "idle" && !(S.chainReq || (S.chainReq = new Set())).has(k)) {
      S.chainReq.add(k);
      api("POST", "/api/chain", {slug: v.slug}).then(() => refreshOverview()).then(() => renderWatchingParts()).catch(() => {});
    }
  }
}

function vendorPanel(v) {
  let h = "";
  const issues = v.issues || [];
  if (issues.length) {
    h += `<h4>What conflicts with your policies</h4>`;
    h += issues.map(i => `<div class="issue${v.status === "exposed" ? " amber" : ""}">
      <div class="it">${i.rule ? esc(i.rule) + " · " : ""}${esc(i.title)}</div>
      ${i.detail ? `<div class="id">${esc(i.detail)}</div>` : ""}
      ${policyLink(i.policy)}</div>`).join("");
  } else if (v.status === "exposed") {
    h += `<h4>Why it's exposed</h4><div class="issue amber"><div class="id">It relies on a vendor that no longer complies with your Privacy Policy.</div></div>`;
  }
  const sps = v.subprocessors || [];
  if (S.ov.real) {
    if (v.purpose) h += `<h4>What it does for you</h4><p class="chain-note">${esc(v.purpose)}</p>`;
    h += `<h4>Its sub-processors</h4>`;
    const simRows = sps.filter(x => x.simulated);
    const simList = simRows.length ? `<ul class="sp">${simRows.map(x => `<li><span>${esc(x.name)}</span><span class="c">· ${x.country ? esc(x.country) : "location not listed"}</span><span class="tag">simulated</span>${(x.review || []).length ? `<span class="rv">review: ${esc(x.review.join(", "))}</span>` : ""}</li>`).join("")}</ul>` : "";
    if (v.chain === "loading" || v.chain === "idle") return h + simList + `<p class="chain-note">Reading ${esc(cleanName(v.name))}'s sub-processor list via Nimble…</p>`;
    if (v.chain !== "done") return h + simList + `<p class="chain-note">${esc(v.chain_error || "Couldn't read its sub-processor list.")}</p>`;
    const src = safeUrl(v.chain_page);
    return h + `<ul class="sp">${sps.map(s => `<li><span>${esc(s.name)}</span><span class="c">· ${s.country ? esc(s.country) : "location not listed"}</span>${s.simulated ? `<span class="tag">simulated</span>` : ""}${(s.review || []).length ? `<span class="rv">review: ${esc(s.review.join(", "))}</span>` : ""}</li>`).join("")}</ul>`
             + (src ? `<p class="chain-note" style="margin-top:10px">Source: <a href="${esc(src)}" target="_blank" rel="noopener">${esc(src)}</a></p>` : "");
  }
  h += `<h4>Sub-processors</h4>`;
  h += sps.length ? `<ul class="sp">${sps.map(s => {
    const ev = safeUrl(s.evidence_url);
    return `<li><span>${esc(s.name)}</span><span class="c">· ${s.country ? esc(s.country) : "location not listed"}</span>${s.found_by_agent ? `<span class="tag">found by Night's Watch</span>${ev ? `<a href="${esc(ev)}" target="_blank" rel="noopener">evidence</a>` : ""}` : ""}</li>`;
  }).join("")}</ul>` : `<p class="muted" style="font-size:14px;margin:0">This vendor doesn't publish a sub-processor list.</p>`;
  return h;
}

function renderResult() {
  const root = $("#result"); if (!root) return;
  if (S.sim === "running") return;
  const ev = S.ov.latest_event;
  const key = ev ? JSON.stringify(ev) : (S.sim === "done" ? "none-after-sim" : "");
  if (key === S.eventKey) return;
  S.eventKey = key;
  keepOpen(root, () => {
    if (!ev) {
      root.innerHTML = S.sim === "done" && S.jobScenario !== "undo" ? `<div class="card result"><div class="head"><span class="mark" style="background:var(--ink-3)" aria-hidden="true"></span><div class="body"><h3>No policy conflict found</h3><p class="why">Night's Watch checked the change and nothing in it conflicts with your Privacy Policy.</p></div></div></div>` : "";
      return;
    }
    const vendor = cleanName(ev.vendor);
    const bad = ev.kind === "violation";
    const headline = ev.headline || (bad ? `${vendor} is no longer compliant with your Privacy Policy` : `${vendor} is compliant again`);
    const evUrl = safeUrl(ev.evidence_url);
    const ag = ev.agent;
    let how = "";
    if (ag && (ag.steps || []).length) {
      how += `<ol>${ag.steps.map(s => `<li>${esc(s.text)}${s.detail ? `<div class="d">${esc(s.detail)}</div>` : ""}</li>`).join("")}</ol>`;
    } else if (bad) {
      how += `<p style="margin:0">Found by comparing ${esc(vendor)}'s latest page with what Night's Watch remembered from the last check.</p>`;
    }
    const meta = [];
    if (ag && ag.model) meta.push(`Model: ${esc(ag.model)}`);
    if (ag && ag.seconds != null) meta.push(`${Number(ag.seconds).toFixed(1)} s`);
    if (ev.tick != null) meta.push(`check ${esc(ev.tick)}`);
    if (evUrl) meta.push(`<a href="${esc(evUrl)}" target="_blank" rel="noopener">View evidence</a>`);
    if (meta.length) how += `<div class="meta">${meta.join(" · ")}</div>`;
    const mem = ev.memory_edits || [];
    root.innerHTML = `<div class="card result tone-${bad ? "red" : "green"}">
      <div class="head"><span class="mark" aria-hidden="true"></span><div class="body">
        ${ev.simulated ? `<span class="sim-tag">Simulated</span>` : ""}<h3>${esc(headline)}</h3>
        ${ev.why ? `<p class="why">${esc(ev.why)}</p>` : ""}
        ${bad ? policyLink(ev.policy) : ""}
        ${how ? `<details class="disc" data-k="how"><summary>How Night's Watch found this</summary><div class="disc-body">${how}</div></details>` : ""}
        ${mem.length ? `<details class="disc" data-k="mem"><summary>What it remembered</summary><div class="disc-body"><ul>${mem.map(m => `<li>${esc(m)}</li>`).join("")}</ul></div></details>` : ""}
      </div></div></div>`;
  });
}

function renderFast() {
  const root = $("#fast"); if (!root) return;
  if (S.ov.real) { root.innerHTML = ""; return; }
  const st = S.ov.stats || {};
  const p = st.proof;
  let rows = `<li><span>Checks run</span><span>${fmt(st.checks)}</span></li>
    <li><span>Changes set aside without calling a model</span><span>${fmt(st.discarded)}</span></li>
    <li><span>Night's Watch working memory</span><span>${fmt(st.memory_tokens)} tokens</span></li>
    <li><span>Re-reading the full history instead (computed, not run)</span><span>${fmt(st.naive_tokens)} tokens</span></li>`;
  let proof = "";
  if (p && typeof p === "object") {
    const lh = p.long_horizon || p;
    const ct = p.crash_test || p;
    const pr = [];
    const ratio = lh.ratio_end ?? lh.ratio;
    const days = lh.days || 365;
    if (lh.cards_tokens_end != null && lh.naive_tokens_end != null)
      pr.push([`Memory after ${fmt(days)} days vs full history`, `${fmt(lh.cards_tokens_end)} vs ${fmt(lh.naive_tokens_end)} tokens${ratio ? ` (${Number(ratio).toFixed(0)}x smaller)` : ""}`]);
    else if (ratio != null) pr.push([`Smaller than re-reading history after ${fmt(days)} days`, `${Number(ratio).toFixed(0)}x`]);
    const day = lh.naive_over_window_day ?? lh.naive_passes_day ?? lh.naive_65k_day;
    if (day != null) pr.push([`Full history passes the ${fmt(lh.window_tokens || 65536)}-token model limit`, `day ${fmt(day)}`]);
    if (lh.matched != null) pr.push(["Planted policy breaks caught", `${fmt(lh.matched)} of ${fmt(lh.truth ?? lh.matched)}${lh.unexpected != null ? `, ${fmt(lh.unexpected)} false alarms` : ""}`]);
    if (ct.crashes != null || ct.recoveries != null) pr.push(["Recovered from crashes", `${fmt(ct.recoveries)} of ${fmt(ct.crashes)}${ct.missing_ids === 0 && ct.dup_ids === 0 ? ", nothing lost or duplicated" : ""}`]);
    if (pr.length) proof = `<p class="rows-h">Over a simulated year</p><ul class="rows">${pr.map(([a, b]) => `<li><span>${esc(a)}</span><span>${esc(b)}</span></li>`).join("")}</ul>`;
  }
  const html = `<details class="disc" data-k="fast"><summary>Why this stays fast for months</summary><div class="disc-body">
    <p class="muted" style="margin:0 0 8px">Night's Watch keeps a short memory of each vendor instead of re-reading its whole history on every check, so each check costs the same on day 300 as on day 1.</p>
    <ul class="rows">${rows}</ul>${proof}</div></details>`;
  if (root.dataset.sig === html) return;
  keepOpen(root, () => { root.innerHTML = html; });
  root.dataset.sig = html;
}

// ---------- simulation ----------
function setSimBusy(busy) {
  ["#run", "#undo"].forEach(s => { const b = $(s); if (b) b.disabled = busy; });
  app.querySelectorAll('input[name="scn"]').forEach(i => i.disabled = busy);
  const run = $("#run"); if (run) run.textContent = busy ? "Running…" : "Run simulation";
}

// default simulation target: the first vendor that is currently compliant
function simVendor() {
  const vs = (S.ov && S.ov.vendors) || [];
  if (S.simVendor && vs.some(v => v.slug === S.simVendor)) return S.simVendor;
  const v = vs.find(x => x.status === "compliant") || vs[0];
  return v ? v.slug : "";
}

async function simulate(scenario) {
  if (S.job) return;
  S.sim = "running"; S.jobScenario = scenario;
  setSimBusy(true);
  $("#result").innerHTML = ""; S.eventKey = "";
  $("#sim-run").hidden = false; $("#sim-fail").hidden = true;
  const ol = $("#sim-steps"); ol.innerHTML = "";
  renderStepsInto(ol, [{text: scenario === "undo" ? "Undoing changes" : "Starting the simulation", state: "active"}]);
  let r;
  const body = {scenario, slug: simVendor()};
  if (scenario === "custom") Object.assign(body, {name: (S.cName || "").trim(), url: (S.cUrl || "").trim()});
  try { r = await api("POST", "/api/simulate", body); }
  catch { return simFailed("Can't reach the Night's Watch service."); }
  if (r.status === 409) return simFailed("Night's Watch is finishing another check. Try again in a moment.");
  if (r.status >= 400 || !r.data.job) return simFailed(r.data.error || `The request failed (${r.status}).`);
  ol.innerHTML = "";
  pollJob(r.data.job, job => {
    if (S.screen === "watching") renderStepsInto($("#sim-steps"), job.steps);
  }, async job => {
    if (S.screen !== "watching") { S.sim = "idle"; return; }
    if (job.status === "failed") return simFailed(job.error || "A step failed.");
    S.lastChecked = new Date();
    try { await refreshOverview(); } catch {}
    S.sim = "done";
    $("#sim-run").hidden = true;
    setSimBusy(false);
    renderWatchingParts();
    const res = $("#result");
    if (res && res.firstElementChild) res.scrollIntoView({block: "nearest", behavior: reduced() ? "auto" : "smooth"});
  });
}

function simFailed(msg) {
  S.sim = "failed"; S.job = null;
  const ol = $("#sim-steps");
  if (ol && !ol.querySelector("li.failed")) {
    const act = ol.querySelector("li.active");
    if (act) { act.className = "failed"; act.querySelector(".ic").innerHTML = ICON.x; act.dataset.sig = ""; }
  }
  $("#sim-fail-msg").textContent = msg;
  $("#sim-fail").hidden = false;
  setSimBusy(false);
  $("#sim-retry").focus();
}

// ---------- boot ----------
// ---------- navigation ----------
function go(screen, push) {
  if (push !== false && location.hash !== "#" + screen) history.pushState({screen}, "", "#" + screen);
  if (screen === "watching" && S.ov && S.ov.watching) showWatching(); else showConnect();
  window.scrollTo({top: 0});
}
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest("#home");
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault();
  if (S.screen === "setup") return;          // setup finishes on its own; don't strand it
  go("start");
});
window.addEventListener("popstate", () => {
  if (S.screen === "setup") return;
  go(location.hash === "#watching" ? "watching" : "start", false);
});
function setTitle() {
  const vs = (S.ov && S.ov.vendors) || [];
  const red = vs.filter(v => v.status === "not_compliant").length;
  if (S.ov && S.ov.real && S.screen === "watching") {
    const n = vs.filter(v => v.status === "review" || v.status === "exposed").length;
    document.title = red ? `Night's Watch · ${red} not compliant` : n ? `Night's Watch · ${n} need review` : "Night's Watch · all approved"; return;
  }
  document.title = S.screen === "watching" && red ? `Night's Watch · ${red} vendor${red === 1 ? "" : "s"} not compliant`
                 : S.screen === "watching" ? "Night's Watch · all vendors compliant" : "Night's Watch";
}

async function boot() {
  if (MOCK) { const n = document.createElement("div"); n.className = "mock-note"; n.innerHTML = 'Replay of a real recorded run · <a href="guided.html" style="color:inherit">detailed view</a>'; document.body.appendChild(n); }
  app.innerHTML = topBar("") + `<main class="hero"><p class="muted">Loading…</p></main>`;
  try { await refreshOverview(); }
  catch { S.error = "Can't reach the Night's Watch service yet. You can still try to connect."; showConnect(); return; }
  S.url = S.ov.site_url || "";
  if (S.ov.watching && location.hash === "#watching") showWatching(); else showConnect();  // "/" opens on the hero
}
boot();
})();
</script>
